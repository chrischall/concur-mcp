version: 1
name: SAP Concur
slug: concur
# Hosting: browser-bridge bootstrap. The fetchproxy bridge only lifts the
# HttpOnly session cookies (`JWT`, plus the OTSESSION pair when present) from
# the user's signed-in <dc>.concursolutions.com tab; every API call is then
# plain Node fetch with `Authorization: Bearer`. So the
# registration needs runtime `fly-shared`, `bridge: true` and
# `bridgePortEnv: CONCUR_WS_PORT` — none of which this manifest can express
# (they are registration fields, set over the control API).
summary: >-
  Read and write SAP Concur expense reports, expenses, receipts and trips,
  with every write confirmation-gated. Signs in through your logged-in
  Concur browser tab.
examples:
  - prompt: Which of my Concur expense reports haven't been submitted yet, and what are their totals?
    note: Lists your unsubmitted reports with their amounts and dates.
  - prompt: Open my latest expense report and tell me which entries are missing a receipt or have policy exceptions.
    note: Read-only; flags blocking exceptions that would stop submission.
  - prompt: What card transactions and receipts in Concur aren't on any report yet?
    note: Shows available expenses still waiting to be added to a report.
env:
  - name: CONCUR_DC
    required: false
    help: >-
      Concur datacenter, taken from the signed-in tab's host (us2 for
      us2.concursolutions.com, eu2 for eu2.concursolutions.com, …). Defaults to
      us2. Must match the session JWT's issuer or every call fails with an
      actionable mismatch error.
  - name: CONCUR_WS_PORT
    required: false
    help: >-
      Concentrator port for the fetchproxy bridge (defaults to the fleet-shared
      37149). The runner injects a per-registration port for a hosted bridged
      child, so this is the name to give `bridgePortEnv` at registration.
  - name: CONCUR_OUTPUT_DIR
    required: false
    help: >-
      Where concur_get_receipt saves downloaded receipts, never overwriting an
      existing file (defaults to ~/Downloads/concur-mcp). Unused when receipts
      are returned inline, which is the default when hosted.
  - name: CONCUR_UPLOAD_ROOTS
    required: false
    help: >-
      The only folders concur_upload_receipt may read from (a
      path-delimiter-separated list, ~ expanded). Defaults to
      $MCP_DATA_DIR/uploads when hosted; locally ~/Downloads, ~/Documents
      and ~/Desktop, plus the working directory only when it is a folder
      inside the home directory.
  - name: CONCUR_INLINE_RECEIPTS
    required: false
    help: >-
      true returns concur_get_receipt's image in the tool result instead of
      writing a file. Defaults to on when hosted (MCP_DATA_DIR set — the
      runner's disk is not the user's) and off locally.
  - name: MCP_USER_TZ
    required: false
    help: >-
      Your IANA time zone (e.g. America/New_York). concur_create_report
      defaults reportDate to today in this zone; unset, a hosted server uses
      UTC, so a report created in the evening is dated tomorrow.
  - name: CONCUR_DEBUG
    required: false
    help: >-
      Truthy logs the fetchproxy bridge's role and lifecycle to stderr.
      Diagnostic only.
  - name: MCP_CONFIRM_MODE
    required: false
    help: >-
      What a confirmation-gated write does on a client that cannot show a
      confirmation prompt: ask-user (default; preview + token, the user
      approves in chat), auto (the model may use the token itself after the
      preview), or refuse. An unrecognised value is treated as refuse.
  - name: MCP_CONFIRM_ELICITATION
    required: false
    help: >-
      on (default) confirms writes with an MCP elicitation prompt when the
      client supports one; off never prompts, so every client takes the
      MCP_CONFIRM_MODE path (for clients that declare elicitation but never
      render it).
state:
  dataDir: true
  reason: >-
    keeps the fetchproxy identity under $HOME/.fetchproxy so the browser
    pairing survives restarts; without it every cold start asks the user to
    re-pair
# egress: deliberately NO fixed `allow` block. The server process dials only
# the tenant-derived API host https://www-<dc>.api.concursolutions.com
# (/spend-graphql/graphql, /spend-graphql/upload, /cds/graphql), where <dc>
# comes from CONCUR_DC (e.g. www-us2.api.concursolutions.com). The web host
# <dc>.concursolutions.com is reached only by the user's browser over the
# bridge (cookie lift), never by this process.
