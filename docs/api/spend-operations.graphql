### UpdateExistingExpenseEntry
mutation UpdateExistingExpenseEntry(
    $reportId: ID!
    $expenseId: ID!
    $contextRole: ContextRoleType!
    $userId: ID!
    $fields: UpdateExpenseFieldsInput!
    $taxFields: [TaxField!] = null
    $expenseTypeId: String!
    $policyId: String!
    $updateRecentExpenseType: Boolean!
    $shouldCopyDownFields: Boolean!
    $isTrexEnabled: Boolean!
    $expenseListDetailFormId: String
    $showAttendeeField: Boolean! = false
  ) {
    updateExpense(
      dataContext: {
        reportId: $reportId
        expenseId: $expenseId
        fields: $fields
        taxFields: $taxFields
        shouldCopyDownFields: $shouldCopyDownFields
        expenseListDetailFormId: $expenseListDetailFormId
      }
      userContext: {userId: $userId, contextType: $contextRole}
    ) {
      id
      # The following items are needed for the existing entry after save
      reportDetails @include(if: $isTrexEnabled) {
        ...ExpenseReportDetailsFragment
      }
      entry @include(if: $isTrexEnabled) {
        ...EreExpenseEntrySummaryFragment
      }
      existingExpenseForm @include(if: $isTrexEnabled) {
        ...ExistingExpenseFormFragment
      }
      entryExceptions @include(if: $isTrexEnabled) {
        ...EreEntryExceptionsFragment
      }
      expenseTypeFilters @include(if: $isTrexEnabled) {
        shouldFilterCashAdvanceExpenseTypes
        shouldFilterCompanyCarExpenseType
        shouldFilterPersonalCarExpenseType
      }
    }

    CDS_addRecentExpenseTypes(
      policyId: $policyId
      expenseTypeId: $expenseTypeId
    ) @include(if: $updateRecentExpenseType)
  }

