### GetTripDetails
query GetTripDetails(
    $userId: String!
    $tripId: String
    $segmentId: String!
    $segmentType: TripSegmentType
    $reportId: String
  ) {
    employee(userId: $userId) {
      userId
      contextRole
      tripDetails( # er.TripData.getTripSegmentJson
        tripId: $tripId
        segmentId: $segmentId
        segmentType: $segmentType
        reportId: $reportId
      ) {
        tripId
        tripName
        tripDescription
        ticketNumber
        startDate
        endDate
        userId
        transactionDate
        comparisonFare {
          value
          currencyCode
        }
        ruleViolations {
          companyReasonCode
          violationReasonCode
          description
        }
        estimatedAmount {
          value
          currencyCode
        }
        transactionAmount {
          value
          currencyCode
        }
        vendorDescription
        taxiSegment {
          vendor
          startDateTime
          endDateTime
          rate {
            value
            currencyCode
          }
          pickupLocation {
            streetAddress
            city
            stateCode
            countryCode
            postalCode
          }
          dropoffLocation {
            streetAddress
            city
            stateCode
            countryCode
            postalCode
          }
          reservationId
        }
        limoSegment {
          vendor
          startDateTime
          endDateTime
          rate {
            value
            currencyCode
          }
          pickupLocation {
            streetAddress
            city
            stateCode
            countryCode
            postalCode
          }
          dropoffLocation {
            streetAddress
            city
            stateCode
            countryCode
            postalCode
          }
          reservationId
        }
        hotelSegment {
          propertyName
          vendor
          numberRooms
          numberOfNights
          rate {
            value
            currencyCode
          }
          startDate
          endDate
        }
        carSegment {
          vendor
          rate {
            value
            currencyCode
          }
          pickupLocation
          startDateTime
          endDateTime
        }
        ticketSegments {
          carrier
          ticketId
          flightNumber
          departureDateTime
          boardPoint
          offPoint
        }
      }
    }
  }

### GetExpenseEntryComments
query GetExpenseEntryComments(
    $reportId: String!
    $expenseId: String!
    $userId: String!
    $contextRole: ContextRoleType!
    $hasItemizations: Boolean
  ) {
    employee(userId: $userId, contextRole: $contextRole) {
      userId
      contextRole
      expenseReport(reportId: $reportId) {
        reportId
        entry(expenseId: $expenseId) {
          id
          entryComments(hasItemizations: $hasItemizations) {
            author {
              firstName
              middleInitial
              lastName
              preferredName
            }
            comment
            createdForEmployeeId
            createdForEmployee {
              firstName
              middleInitial
              lastName
              preferredName
            }
            creationDate
            expenseId
            isLatest
            isItemization
            expenseType {
              name
            }
            amount {
              currencyCode
              value
            }
          }
        }
      }
    }
  }

