### GetNewExpenseEntry
query GetNewExpenseEntry(
    $reportId: String!
    $userId: String!
    $reportIdAsID: ID!
    $userIdAsID: ID!
    $expenseTypeId: ID!
    $contextRole: ContextRoleType!
    $shouldFetchExpenseForm: Boolean! = true
    $expenseTypeChangeContext: ExpenseTypeChangeNewExpenseContext
    $showAttendeeField: Boolean! = false
  ) {
    expenseTypeFilters(
      userId: $userId
      contextRole: $contextRole
      reportId: $reportId
    ) {
      shouldFilterCashAdvanceExpenseTypes
      shouldFilterCompanyCarExpenseType
      shouldFilterPersonalCarExpenseType
    }

    vehicleRegistrationInfo {
      hasPersonalCar
      hasCompanyCar
    }

    employee(userId: $userId, contextRole: $contextRole) {
      userId
      contextRole
      expenseReport(reportId: $reportId) {
        reportId
        rptKey
        reportDetails {
          id
          allocationFormId
          userId
          policy {
            id
            expenseListDetailFormId
            meta {
              canUploadImagesToExpenses
              canShowReceipts
            }
          }

          expenseTypes {
            ...ExpenseTypeFragment
          }

          meta {
            isApproved
            canReopen
            isReopened
            isSubmitted
            canAddExpense
            canAllocateExpenses
            isReceiptImageAvailable
          }

          name

          approvedAmount {
            value
            currencyCode
          }

          currencyCode
          countryCode
          taxConfigId
        }
      }
    }

    # Requested here to pre-fetch the data on the cache (if should fetch at all)
    # and to deal with a wrong ExpenseTypeId
    newExpenseForm(
      dataContext: {
        reportId: $reportIdAsID
        expenseTypeId: $expenseTypeId
        expenseTypeChangeContext: $expenseTypeChangeContext
      }
      userContext: {userId: $userIdAsID, contextType: $contextRole}
    ) @include(if: $shouldFetchExpenseForm) {
      travelRequestEntries {
        entries {
          id
          value
        }
      }
      mainForm(showAttendeeField: $showAttendeeField) {
        attendeesLinkAccessMode
        calculateTaxLinkAccessMode
        fields {
          ...FormFieldFragment
        }
      }
      meta {
        canAllocate
      }
      expenseTypeDetails {
        quickTips
      }
      backendMileageConfigs
    }
  }

### GetExistingExpenseEntry
query GetExistingExpenseEntry(
    $expenseId: String!
    $reportId: String!
    $userId: String!
    $contextRole: ContextRoleType!
    $expenseIdAsID: ID!
    $reportIdAsID: ID!
    $userIdAsID: ID!
    $shouldFetchExpenseForm: Boolean! = true
    $shouldFetchReportExceptions: Boolean! = false
    $expenseTypeChangeContext: ExpenseTypeChangeExistingExpenseContext
    $isBondUser: Boolean! = false
    $showAttendeeField: Boolean! = false
  ) {
    expenseTypeFilters(
      userId: $userId
      contextRole: $contextRole
      reportId: $reportId
      expenseId: $expenseId
    ) {
      shouldFilterCashAdvanceExpenseTypes
      shouldFilterCompanyCarExpenseType
      shouldFilterPersonalCarExpenseType
    }

    vehicleRegistrationInfo {
      hasPersonalCar
      hasCompanyCar
    }

    entryExceptions(
      expenseId: $expenseId
      reportId: $reportId
      userId: $userId
      contextRole: $contextRole
    ) {
      ...EreEntryExceptionsFragment
    }

    employee(userId: $userId, contextRole: $contextRole) {
      userId
      contextRole
      expenseReport(reportId: $reportId) {
        reportId
        rptKey
        reportDetails {
          ...ExpenseReportDetailsFragment
        }
        entry(expenseId: $expenseId) {
          ...EreExpenseEntrySummaryFragment
          meta {
            isAiAssisted @include(if: $isBondUser)
          }
        }
      }
    }

    existingExpenseForm(
      dataContext: {
        expenseId: $expenseIdAsID
        reportId: $reportIdAsID
        expenseTypeChangeContext: $expenseTypeChangeContext
      }
      userContext: {userId: $userIdAsID, contextType: $contextRole}
    ) @include(if: $shouldFetchExpenseForm) {
      ...ExistingExpenseFormFragment
    }

    reportExceptions(
      reportId: $reportId
      userId: $userId
      contextRole: $contextRole
    ) @include(if: $shouldFetchReportExceptions) {
      ...ReportExceptionsFragment
    }
  }

fragment ReportExceptionsFragment on ReportExceptions {
    reportId
    countOfExceptions
    hasBlockingExceptions

    reportExceptions {
      allocationId
      exceptionCode
      expenseId
      parentExpenseId
      isBlocking
      message
      parameters {
        entryExceptionAttendees {
          lastName
          firstName
          entryAmount
          crnCode
          totalExpensed
          totalAuthorized
        }
        missingFields {
          missingSpecialParentField
          fields
          fieldIds
        }
      }
    }

    entryExceptions {
      ...EntryExceptionsFragment
    }
  }

fragment EntryExceptionsFragment on EntryExceptions {
    reportId
    expenseId
    attendeesExceptionLevel
    countOfExceptions
    hasBlockingExceptions
    transactionAmount {
      value
      currencyCode
    }
    transactionDate
    expenseType {
      id
      code
      name
      meta {
        isJapanPublicTransportation
      }
    }
    entryExceptions {
      ...EntryExceptionFragment
    }
    itemizationsExceptions {
      reportId
      expenseId
      itemizationId
      attendeesExceptionLevel
      countOfExceptions
      hasBlockingExceptions
      transactionAmount {
        value
        currencyCode
      }
      transactionDate
      expenseType {
        id
        code
        name
        meta {
          isJapanPublicTransportation
        }
      }
      exceptions {
        ...EntryExceptionFragment
      }
    }
  }

fragment EntryExceptionFragment on ExpenseEntryException {
    allocationId
    exceptionCode
    expenseId
    isBlocking
    message
    parentExpenseId
    parameters {
      entryExceptionAttendees {
        lastName
        firstName
        entryAmount
        crnCode
        totalExpensed
        totalAuthorized
      }
      missingFields {
        missingSpecialParentField
        fields
        fieldIds
      }
    }
  }

### GetExpenseTypesForReport
query GetExpenseTypesForReport(
    $userId: ID!
    $contextRole: ContextRoleType!
    $policyId: ID!
    $reportId: ID!
    $reportOwnerUserId: ID!
  ) {
    CDS_expense {
      recentExpenseTypes(policyId: $policyId) {
        id
      }
    }

    expenseTypesForReport(
      userId: $userId
      contextRole: $contextRole
      policyId: $policyId
      reportId: $reportId
      reportOwnerUserId: $reportOwnerUserId
    ) {
      id
      code
      name
      parentName
      description
      text
      header
      visibilityCode
    }

    vehicleRegistrationInfo {
      hasPersonalCar
      hasCompanyCar
    }
    siteSettings {
      isMileageServiceEnabled
      allowJptPublicSectorEnhancement
    }
  }

