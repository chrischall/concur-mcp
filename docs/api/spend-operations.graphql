### GetLineItemImage
query GetLineItemImage(
    $userId: String!
    $reportOwnerUserId: String
    $contextRole: ContextRoleType!
    $imageId: String!
    $reportId: String = null
    $imageOrigin: ImageType = null
  ) {
    employee(userId: $userId, contextRole: $contextRole) {
      userId
      contextRole
      lineItemImage(imageId: $imageId, reportOwnerUserId: $reportOwnerUserId) {
        imageId
        receiptId
        fileType
        #imageType
        imageDate
        fileName
        imageOrigin
        imageUrl
        #protImageId
        thumbUrl
        receiptDigitizationStatus
        complianceCountryCode
        complianceType
        timestamp {
          ...EbunshoTimestampFragment
        }
        meta(reportId: $reportId, imageOrigin: $imageOrigin) {
          ...LegacyReceiptMetadataFragment
        }
      }
    }
  }

fragment EbunshoTimestampFragment on EbunshoTimestamp {
    status
    resolution
    colorDepth
    timestampDate
  }

fragment LegacyReceiptMetadataFragment on LegacyReceiptMetadata {
    isEbunshoReceipt
    canAppendReceipt
    canDetachReceipt
    canReplaceReceipt
    canDownloadReceipt
    canDeleteReceipt
    canSaveReceiptRotation
    isAllowedForMultipleUse
  }

### GetLineItemImages
query GetLineItemImages(
    $userId: String!
    $contextRole: ContextRoleType!
    $reportId: String!
  ) {
    employee(userId: $userId, contextRole: $contextRole) {
      userId
      contextRole
      expenseReport(reportId: $reportId) {
        reportId
        lineItemImages {
          ...LegacyReceiptFragment
        }
      }
    }
  }

fragment LegacyReceiptFragment on LegacyReceipt {
    imageId
    receiptId
    fileType
    #imageType
    imageDate
    fileName
    imageOrigin
    imageUrl
    #protImageId
    thumbUrl
    timestamp {
      ...EbunshoTimestampFragment
    }
    receiptDigitizationStatus
    complianceCountryCode
    complianceType
    meta {
      ...LegacyReceiptMetadataFragment
    }
  }

### GetAvailableReceipts
query GetAvailableReceipts(
    $userId: String!
