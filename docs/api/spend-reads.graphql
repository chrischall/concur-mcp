### GetExpenseEntryComments
query GetExpenseEntryComments(
    $reportId: String!
    $expenseId: String!
    $userId: String!
    $contextRole: ContextRoleType!
    $hasItemizations: Boolean
  ) {
    employee(userId: $userId, contextRole: $contextRole) {
      userId
      contextRole
      expenseReport(reportId: $reportId) {
        reportId
        entry(expenseId: $expenseId) {
          id
          entryComments(hasItemizations: $hasItemizations) {
            author {
              firstName
              middleInitial
              lastName
              preferredName
            }
            comment
            createdForEmployeeId
            createdForEmployee {
              firstName
              middleInitial
              lastName
              preferredName
            }
            creationDate
            expenseId
            isLatest
            isItemization
            expenseType {
              name
            }
            amount {
              currencyCode
              value
            }
          }
        }
      }
    }
  }

### GetExpenseTypesForReport
query GetExpenseTypesForReport(
    $userId: ID!
    $contextRole: ContextRoleType!
    $policyId: ID!
