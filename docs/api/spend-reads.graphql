### GetAllocations
query GetAllocations(
    $reportId: ID!
    $expenseId: ID!
    $reportId2: String!
    $expenseIdForExceptions: String!
    $contextRole: CDS_ExpenseAllocationType!
    $contextRole2: ContextRoleType!
    $userId: ID
    $userId2: String!
  ) {
    CDS_expense {
      allocations(
        reportId: $reportId
        expenseId: $expenseId
        contextType: $contextRole
        userId: $userId
      ) {
        accountCode
        allocationId
        expenseId
        overLimitAccountCode
        isSystemAllocation
        percentage
        isPercentEdited
        fields {
          ...CDSFormFieldFragment
        }
        allocationAmount {
          ...CDSExpenseAmountFragment
        }
        approvedAmount {
          ...CDSExpenseAmountFragment
        }
        claimedAmount {
          ...CDSExpenseAmountFragment
        }
      }
    }
    entryExceptions(
      reportId: $reportId2
      expenseId: $expenseIdForExceptions
      userId: $userId2
      contextRole: $contextRole2
    ) {
      expenseId
      entryExceptions {
        ...EntryExceptionFragment
      }
      itemizationsExceptions {
        expenseId
        itemizationId
        exceptions {
          ...EntryExceptionFragment
        }
      }
    }
  }

fragment CDSFormFieldFragment on CDS_FormField {
    id
    label
    formFieldId
    value {
      ... on CDS_ListValue {
        isValid
        listValue: value {
          code
          id
          value
        }
      }
      ... on CDS_ListItemValue {
        code
        id
        listItemValue: value
      }
      ... on CDS_StringValue {
        stringValue: value
      }
      ... on CDS_IntegerValue {
        integerValue: value
      }
      ... on CDS_FloatValue {
        floatValue: value
      }
      ... on CDS_BooleanValue {
        booleanValue: value
        isValid
      }
      ... on CDS_DateValue {
        dateValue: value
        isValid
      }
      ... on CDS_AmountValue {
        amountValue: value {
          value
        }
      }
      ... on CDS_ExpenseAmount {
        expenseAmountValue: value
        currency {
          code
          name
          decimalPlaces
        }
      }
    }
    defaultValue {
      ... on CDS_ListValue {
        isValid
        listValue: value {
          code
          id
          value
        }
      }
      ... on CDS_ListItemValue {
        code
        id
        listItemValue: value
      }
      ... on CDS_StringValue {
        stringValue: value
      }
      ... on CDS_IntegerValue {
        integerValue: value
      }
      ... on CDS_FloatValue {
        floatValue: value
      }
      ... on CDS_BooleanValue {
        booleanValue: value
        isValid
      }
      ... on CDS_DateValue {
        dateValue: value
        isValid
      }
      ... on CDS_AmountValue {
        amountValue: value {
          value
        }
      }
      ... on CDS_ExpenseAmount {
        expenseAmountValue: value
        currency {
          code
          name
          decimalPlaces
        }
      }
    }
    accessMode
    control
    dataType
    sequence
    maximumLength
    tooltip
    hasLineSeparator
    isCopyDownSource
    isExternalList
    targetFieldSettings {
      action
      formFieldId
      lhsOperandSource
      operator
      rhsOperand
    }
    isRequired
    list {
      id
      level
      parentId
      displayFormat
      defaultSearchBy: searchCriteria
    }
    dataValidator {
      validationExpression
      failureMessage
    }
    requiredForSave
  }

