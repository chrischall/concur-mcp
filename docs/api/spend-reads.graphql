
### GetReportsForUser
query GetReportsForUser(
    $contextRole: ContextRoleType!
    $dateRange: InputDateRange
    $filterByStatus: InputFilterBy
    $paging: InputPagination
    $sortBy: InputSortBy
    $sortDirection: InputSortDirection
    $userId: String!
    $isAiUser: Boolean = false
  ) {
    employee(contextRole: $contextRole, userId: $userId) {
      userId
      contextRole
      mostRecentAgenticReport @include(if: $isAiUser)
      reportsForUser(
        input: {
          dateRange: $dateRange
          filterByStatus: $filterByStatus
          paging: $paging
          sortBy: $sortBy
          sortDirection: $sortDirection
        }
      ) {
        list {
          reportId: id
          aiAssistedExpenseCount @include(if: $isAiUser)
          allAiAssistedExpenseCount @include(if: $isAiUser)
          approvedAmount {
            currencyCode
            value
          }
          approvalStatus
          approvalStatusId
          approver {
            firstName: first
            lastName: last
            preferredName
          }
          claimedAmount {
            currencyCode
            value
          }
          endDate
          exceptionLevel
          wasSentForPayment: isSentForPayment
          meta {
            canAddExpense
            isMarkedForReviewByDelegate
            isApproved
            isPendingApproval
            isSentForPayment
            isPaymentConfirmed
            isSentBack
            isSubmitted
            isReopened
            isAiAssisted @include(if: $isAiUser)
          }
          name
          paymentStatus
          reportNumber
          reportDate
          reportTotal {
            currencyCode
            value
          }
          reportType
          sentBackDate
          startDate
          submitDate
          paidDate
          rptKey
          totalAmountDueEmployee {
            currencyCode
            value
          }
        }
        pagination {
          ...PaginationFragment
        }
      }
    }
  }

fragment PaginationFragment on PaginationResponse {
    number
    size
    totalElements
    totalPages
  }

### GetReportPageData
query GetReportPageData(
    $userId: String!
    $reportId: String!
    $contextRole: ContextRoleType!
    $includeWorkflows: Boolean!
    $includeCostObjects: Boolean!
    $includeSummary: Boolean!
    $includePolicy: Boolean!
    $includeEntries: Boolean!
    $includeExceptions: Boolean!
    $includeGroupSettings: Boolean!
    $includeDetails: String
    $includeSiteSettings: Boolean!
  ) {
    employee(userId: $userId, contextRole: $contextRole) {
      userId
      contextRole
      expenseReport(reportId: $reportId) {
        reportId
        rptKey
        reportDetails @include(if: $includeSummary) {
          ...ReportDetailsFragment
          policy @include(if: $includePolicy) {
            ...ReportPolicyFragment
          }
          groupSettings @include(if: $includeGroupSettings) {
            ...GroupSettingsFragment
          }
        }
        workflow @include(if: $includeWorkflows) {
          ...WorkflowFragment
        }
        workflowTransitions @include(if: $includeWorkflows) {
          ...WorkflowTransitionFragment
        }
        costObjects @include(if: $includeCostObjects) {
          ...CostObjectFragment
        }
      }
    }
    reportEntriesDetails(
      userId: $userId
      reportId: $reportId
      contextRole: $contextRole
      expenseListDetailFormId: $includeDetails
    ) @include(if: $includeEntries) {
      ...EntriesAndColumnsFragment
    }
    reportExceptions(
      reportId: $reportId
      userId: $userId
      contextRole: $contextRole
    ) @include(if: $includeExceptions) {
      ...ReportExceptionsFragment
    }

    siteSettings @include(if: $includeSiteSettings) {
      allowMultipleUseOfSingleReceipt
      isMultipleRequestsAllowed
    }
  }

