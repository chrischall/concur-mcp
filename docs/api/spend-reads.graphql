### GetLocations
query GetLocations(
    $cityName: String!
    $countryCode: String = null
    $subdivisionCode: String = null
  ) {
    locations: CDS_locations(
      cityName: $cityName
      countryCode: $countryCode
      subdivisionCode: $subdivisionCode
    ) {
      id # e.g. 5965E68F48AC4FA9A1AF739D6AE5D225
      locationId # e.g. feea1853-9e06-4611-9cf0-834f834d4dd8
      legacyKey
      # preferredNameId - 5965e68f-48ac-4fa9-a1af-739d6ae5d225
      # code - CATOR
      name # e.g. Toronto
      preferredDisplay # e.g. Toronto, Ontario
      country {
        code # e.g. CA
        name # e.g. CANADA
        currencyCode # e.g. CAD
        currencyName # e.g. Canadian Dollar
      }
      subdivision {
        code # e.g. CA-ON
        name # e.g. Ontario
      }
    }
  }

