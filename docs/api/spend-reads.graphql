### GetReportPageSecondaryData
query GetReportPageSecondaryData(
    $userId: String!
    $reportId: String!
    $contextRole: ContextRoleType!
    $includeCashAdvances: Boolean!
    $includeRequests: Boolean!
    $includeTravelAllowance: Boolean!
    $includePrintFormats: Boolean!
    $includeComments: Boolean!
  ) {
    employee(userId: $userId, contextRole: $contextRole) {
      userId
      contextRole
      expenseReport(reportId: $reportId) {
        reportId
        reportDetails {
          id
          aiAssistedExpenseCount
          meta {
            hasRequest @include(if: $includeRequests)
            hasCashAdvance @include(if: $includeCashAdvances)
            hasExpenses
          }
          travelAllowanceView @include(if: $includeTravelAllowance) {
            ...TravelAllowanceViewFragment
          }
          printFormats @include(if: $includePrintFormats) {
            ...PrintFormatFragment
          }
          comments @include(if: $includeComments) {
            ...CommentFragment
          }
        }
        cashAdvances @include(if: $includeCashAdvances) {
          ...CashAdvanceForReportFragment
        }
        requests @include(if: $includeRequests) {
          ...TravelRequestFragment
        }
      }
    }
    unusedCashAdvances(userId: $userId) @include(if: $includeCashAdvances) {
      ...CashAdvanceFragment
    }
  }

