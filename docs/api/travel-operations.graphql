                                    supplierDisplayName
                                    bookingState
                                    confirmationNumber
                                    actionDetails {
                                        ... on TravelTripHistoryBookingCreateHotelActionDetails {
                                            propertyName
                                        }
                                    }
                                }
                                ... on TravelTripHistoryBookingUpdateAction {
                                    type: __typename
                                    bookingType
                                    bookingLocation {
                                        start {
                                            ...historyLocation
                                        }
                                        end {
                                            ...historyLocation
                                        }
                                    }
                                    supplierDisplayName
                                    actionDetails {
                                        ... on TravelTripHistoryBookingUpdateHotelActionDetails {
                                            type: __typename
                                            updateType: type
                                            propertyName
                                        }
                                    }
                                }
                                ... on TravelTripHistoryBookingCancelAction {
                                    type: __typename
                                    bookingType
                                    cancelationNumber
                                    status
                                    bookingLocation {
                                        start {
                                            ...historyLocation
                                        }
                                        end {
                                            ...historyLocation
                                        }
                                    }
                                    supplierDisplayName
                                    bookingState
                                    actionDetails {
                                        ... on TravelTripHistoryBookingCancelHotelActionDetails {
                                            propertyName
                                        }
                                    }
                                }
                                ... on TravelTripHistoryBookingDeleteAction {
                                    type: __typename
                                    bookingType
                                    status
                                    bookingLocation {
                                        start {
                                            ...historyLocation
                                        }
                                        end {
                                            ...historyLocation
                                        }
                                    }
                                    supplierDisplayName
                                    bookingState
                                    actionDetails {
                                        ... on TravelTripHistoryBookingDeleteHotelActionDetails {
                                            propertyName
                                        }
                                    }
                                }
                                ... on TravelTripHistoryTripChangeAction {
                                    type: __typename
                                    status
                                }
                                ... on TravelTripHistoryRequestCreateAction {
                                    type: __typename
                                }
                                ... on TravelTripHistoryRequestRecallAction {
                                    type: __typename
                                }
                                ... on TravelTripHistoryRequestSubmitAction {
                                    type: __typename
                                }
                                ... on TravelTripHistoryOrphanDetectAction {
                                    type: __typename
                                }
                                ... on TravelTripHistoryOrphanDetectEmailAction {
                                    type: __typename
                                    sendDate
                                    recipients {
                                        email
                                    }
                                }
                                ... on TravelTripHistoryRequestApproveAction {
                                    type: __typename
                                    comment
                                }
                                ... on TravelTripHistoryRequestSendBackAction {
                                    type: __typename
                                    comment
                                }
                                ... on TravelTripHistoryRequestApprovalRequireAction {
                                    type: __typename
                                    deadline
                                }
                                ... on TravelTripHistoryRequestDeadlineExpireAction {
                                    type: __typename
                                    deadline
                                }
                                ... on TravelTripHistoryImminentHoldExpirationDetectAction {
                                    type: __typename
                                }
                                ... on TravelTripHistoryImminentHoldExpirationDetectEmailAction {
                                    type: __typename
                                    sendDate
                                    recipients {
                                        email
                                    }
                                }
                                ... on TravelTripHistoryBookingChangeAction {
                                    type: __typename
                                    confirmationNumber
                                    status
                                    bookingType
                                    bookingLocation {
                                        start {
                                            ...historyLocation
                                        }
                                        end {
                                            ...historyLocation
                                        }
                                    }
                                    supplierDisplayName
                                    bookingState
                                    actionDetails {
                                        ... on TravelTripHistoryBookingChangeHotelActionDetails {
                                            propertyName
                                            hotelConfirmationNumber
                                            checkInDate
                                            checkOutDate
                                            checkInTime
                                            checkOutTime
                                        }
                                        ... on TravelTripHistoryBookingChangeCarActionDetails {
                                            pickupPlainDateTime
                                            dropoffPlainDateTime
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }

### booking
query booking($tripId: ID!, $bookingId: ID!) {
        travel {
            trips {
                trip(id: $tripId) {
                    id
                    bookingV2(id: $bookingId) {
                        ...tripBookingV2
                    }
                }
            }
        }
    }

### sendItinerary
mutation sendItinerary($input: TravelTripSendItineraryEmailInput!) {
        travel {
            trip {
                sendItineraryEmail(input: $input) {
                    tripId
                }
            }
        }
    }

### tryCancelTripOrBooking
mutation tryCancelTripOrBooking($tripId: ID!, $bookingIds: [ID!], $token: ID) {
        travel {
            trip {
                tryCancel(tripId: $tripId, bookingIds: $bookingIds, token: $token) {
                    ... on TravelTripCancelSuccessResult {
                        travelTripCancelResult {
                            token
                            punchOutUrl
                        }
                    }
                    ... on TravelTripCancelFailureResult {
                        messages {
                            ...message
                        }
                        trip {
                            id
                            recordLocator
                            name
                            description
                        }
                    }
                    ... on TravelErrorResponse {
                        messages {
                            ...message
                        }
                    }
                }
            }
        }
    }

### cancelSummary
query cancelSummary($tripId: ID!, $bookingIds: [ID!]) {
        travel {
            trips {
                trip(id: $tripId) {
                    id
                }
                cancelSummary(tripId: $tripId, bookingIds: $bookingIds) {
                    tripName
                    tripActivities {
                        ...activities
                    }
                    tripExperience {
                        ...tripExperience
                    }
                    bookings {
                        type: __typename

                        id
                        cancelConditions {
                            ...cancelConditions
                        }
                        ... on TravelTripAirCancelSummaryBooking {
                            journeys {
                                originDisplayName
                                destinationDisplayName
                            }
                        }
                        ... on TravelTripCarCancelSummaryBooking {
                            rentalRulesAndRestrictions {
                                rules {
                                    category
                                    text
                                }
                                fallbackUrl
                            }
                        }
                        ... on TravelTripRailCancelSummaryBooking {
                            fares {
                                ...tripRailFare
                            }
                            rulesAndRestrictions {
                                ...tripRailRulesAndRestrictions
                            }
                            journeys {
                                departure {
                                    ...stationDateTime
                                }
                                arrival {
                                    ...stationDateTime
                                }
                            }
                        }
                        ... on TravelTripHotelCancelSummaryBooking {
                            rate {
                                ...tripHotelRate
                            }
                        }
                    }
                    cannotCancelReason
                }
            }
        }
    }

