### updateWorkItemStatus
mutation updateWorkItemStatus(
        $workItemId: ID!
        $status: TravelTripDelegatesDashboardWorkItemStatus!
        $assigneeId: ID
    ) {
        travel {
            trip {
                updateDelegatesDashboardWorkItemStatus(
                    workItemId: $workItemId
                    status: $status
                    assigneeId: $assigneeId
