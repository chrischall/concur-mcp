    }

### startSearch
mutation startSearch($tripPlanId: ID!) {
        travel {
            trip {
                tripPlan(id: $tripPlanId) {
                    startSearch {
                        ... on TravelTripPlanStartSearchSuccessResult {
                            nextOperation {
                                ...nextOperation
                            }
                            tripConflicts {
                                ...tripConflict
                            }
                            meetingMatches {
                                ...meetingMatch
                            }
                            configurableMessages {
                                ...configurableMessage
                            }
                            messages {
                                ...message
                            }
                        }
                        ... on TravelErrorResponse {
                            messages {
                                ...message
                            }
                        }
                    }
                }
            }
        }
    }

