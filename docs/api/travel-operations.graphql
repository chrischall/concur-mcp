### tripBookingV2
fragment tripBookingV2 on TravelTripBookingV2 {
        id
        status
        type: __typename
        ... on TravelTripAirBookingV2 {
            airBooking: booking {
                ...tripAirBooking
            }
            ruleViolations {
                ...ruleViolation
            }
            costBreakdown {
                ...bookingCostBreakdown
            }
        }
        ... on TravelTripCarBookingV2 {
            carBooking: booking {
                bookingData {
                    ...tripCarBookingData
                }
                totalCostItemized {
                    ...tripCarTotalCostItemized
                }
            }
            ruleViolations {
                ...ruleViolation
            }
            costBreakdown {
                ...bookingCostBreakdown
            }
        }
        ... on TravelTripHotelBookingV2 {
            hotelBooking: booking {
                bookingData {
                    ...tripHotelBookingData
                }
                totalCost {
                    ...tripHotelPrice
                }
            }
            ruleViolations {
                ...ruleViolation
            }
            costBreakdown {
                ...bookingCostBreakdown
            }
        }
        ... on TravelTripRailBookingV2 {
            bookingRecord {
                creationDate
                recordLocators {
                    value
                }
            }
            railBooking: booking {
                fares {
                    ...tripRailFare
                }
                journeys {
                    ...tripRailJourney
                }
                bookingStatus
                totalCost {
                    ...tripRailCost
                }
                rulesAndRestrictions {
                    ...tripRailRulesAndRestrictions
                }
                turnedDownOptions {
                    ...railTurnedDownOption
                }
                messages {
                    ...message
                }
            }
            ruleViolations {
                ...ruleViolation
            }
            costBreakdown {
                ...bookingCostBreakdown
            }
        }
    }

