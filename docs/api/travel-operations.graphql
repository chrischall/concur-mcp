## Refused by concur_graphql_mutation (out of scope — kept so the deny-list fields are traceable)
# Extracted 2026-10-08 from the public trip bundle (scripts/extract-ops.mjs). Fragments they spread
# (nextOperation, tripConflict, meetingMatch, configurableMessage, workItem) are not resolved here.

### holdTrip
mutation holdTrip($tripId: ID!) {
        travel {
            trip {
                hold(tripId: $tripId) {
                    ... on TravelTripHoldSuccessResult {
                        tripId
                    }
                    ... on TravelErrorResponse {
                        messages {
                            ...message
                        }
                    }
                    ... on TravelTripHoldCannotHoldResult {
                        cannotHoldReason
                    }
                }
            }
        }
    }

### confirmTrip
mutation confirmTrip($tripId: ID!) {
        travel {
            trip {
                confirmV2(tripId: $tripId) {
                    ... on TravelTripConfirmSuccessResult {
                        tripId
                    }
                    ... on TravelTripCannotConfirmResult {
                        cannotConfirmReason
                    }
                    ... on TravelErrorResponse {
                        messages {
                            ...message
                        }
                    }
                }
            }
        }
    }

