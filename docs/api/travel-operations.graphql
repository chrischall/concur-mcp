
### loadTripList
query loadTripList($filter: TravelTripListFilterInput, $sort: TravelTripListSortInput, $nextToken: String) {
        travel {
            trips {
                tripPlanEligible
                list(filter: $filter, sort: $sort, nextToken: $nextToken) {
                    ... on TravelTripListSuccessResult {
                        meta {
                            nextToken
                            filter {
                                quick {
                                    value
                                    isSelected
                                }
                                tripName
                                tripStatus {
                                    value
                                    isSelected
                                }
                                content {
                                    value
                                    isSelected
                                }
                                fromDate
                                toDate
                            }
                            sort {
                                sortBy
                                direction
                                isSelected
                            }
                        }
                        trips {
                            id
                            recordLocator
                            status
                            displayStatus
                            name
                            bookings {
                                type
                            }
                            messages {
                                type
                                fields {
                                    key
                                    value
                                }
                            }
                            startDate
                            endDate
                            imageUrl
                            approval {
                                status
                            }
                            messagesV2 {
                                gqlType: __typename
                                ... on TravelTripListUntranslatedMessage {
                                    type
                                    fields {
                                        key
                                        value
                                    }
                                }
                                ... on TravelTripListTranslatedMessage {
                                    message
                                }
                            }
                        }
                    }
                    ... on TravelErrorResponse {
                        messages {
                            code
                            type
                        }
                    }
                }
            }
        }
    }

### loadOverviewTrip
query loadOverviewTrip($tripId: ID!, $customTextKeys: [TravelCustomTextKey!]!, $showTripExtras: Boolean!) {
        travel {
            ...customTexts
            trips {
                trip(id: $tripId) {
                    id
                    recordLocator
                    name
                    description
                    displayStatus
                    traveler {
                        ...tripTraveler
                    }
                    arranger {
                        displayName
                    }
                    localStartDate
                    travelConfigId
                    status
                    localEndDate
                    editability
                    availableActionsMap {
                        ...tripAvailableActions
                    }
                    agencyDetails {
                        name
                        addressList
                        daytime {
                            ...agencyTimeDetails
                        }
                        faxNumber
                        logoUrl
                        nighttime {
                            ...agencyTimeDetails
                        }
                    }
                    containsInitiatedBookings
                    canEnableEreceipts
                    userSuppliedHotelsEnabled
                    totalCost {
                        ...tripCost
                    }
                    totalCostAmount {
                        ...travelPrice
                    }
                    costBreakdownGroups {
                        ...costBreakdownGroup
                    }
                    bookingsV2 {
                        ...tripBookingV2
                    }
                    reservationsV2 {
                        ...tripReservationV2
                    }
                    activities {
                        air {
                            travelVersion
                        }
                        car {
                            travelVersion
                        }
                        hotel {
                            travelVersion
                        }
                        rail {
                            travelVersion
                        }
                    }
                    customFields {
                        id
                        title
                        value
                    }
                    plan {
                        ...itinTripPlan
                    }
                    tripExtras @include(if: $showTripExtras) {
                        ...travelTripExtras
                    }
                    activeLock {
                        ...tripLock
                    }
                    messages {
                        ...message
                    }
                }
            }
        }
    }

### loadTripHistory
query loadTripHistory($tripId: ID!) {
        travel {
